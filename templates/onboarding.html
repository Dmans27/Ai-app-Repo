<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personalize Local AI</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>

<body class="app-body onboarding-page">
  <main class="onboarding-shell">
    <section class="onboarding-card">
      <p class="onboarding-eyebrow">Welcome to Local AI</p>
      <p class="onboarding-progress">Step 1 of 3</p>

      <h1>Add a profile photo</h1>

      <p class="onboarding-subtitle">
        Add a photo so people can recognize you around Local AI.
      </p>

      <form method="post" enctype="multipart/form-data" class="onboarding-form">

        <div class="onboarding-section">
          <label class="profile-photo-upload">
            <input
              type="file"
              name="profile_photo"
              accept="image/*"
            >

            <span class="profile-photo-upload__circle">
              📷
            </span>

            <span class="profile-photo-upload__text">
              Upload photo
            </span>
          </label>
        </div>

        <button type="submit" class="onboarding-submit">
          Continue
        </button>
      </form>
    </section>
  </main>
</body>
</html>
