<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thank you · Dony</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <style>
    body.donate-success-body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", sans-serif;
      background: #f5f5f7;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-y: auto !important;
      height: auto !important;
    }

    .donate-success-shell { width: 100%; max-width: 440px; }

    .donate-success-card {
      background: #ffffff;
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 32px;
      padding: 44px 32px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      text-align: center;
    }

    .donate-success-icon {
      width: 64px; height: 64px; border-radius: 999px;
      background: #eafaf3; color: #10a37f;
      display: grid; place-items: center;
      font-size: 1.8rem; margin: 0 auto 20px;
    }

    .donate-success-title { margin: 0 0 10px; font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; }
    .donate-success-subtitle { margin: 0 0 28px; color: rgba(0,0,0,0.6); font-size: 0.98rem; line-height: 1.6; }

    .donate-success-btn {
      display: inline-block;
      min-height: 52px; line-height: 52px;
      padding: 0 28px;
      border-radius: 999px;
      background: #10a37f; color: #fff;
      font-weight: 700; font-size: 0.96rem;
      text-decoration: none;
    }
    .donate-success-btn:hover { background: #0d8a6c; }
  </style>
</head>
<body class="donate-success-body">
  <main class="donate-success-shell">
    <section class="donate-success-card">
      <div class="donate-success-icon">♥</div>
      <h1 class="donate-success-title">Thank you</h1>
      <p class="donate-success-subtitle">
        {% if donation and donation.is_recurring %}
          Your monthly donation is set up. You can manage or cancel it any time from your account.
        {% else %}
          Your donation is on its way. We'll let the organization know it's from you.
        {% endif %}
      </p>
      <a href="{{ url_for('discover_page') }}" class="donate-success-btn">Back to Dony</a>
    </section>
  </main>
</body>
</html>
