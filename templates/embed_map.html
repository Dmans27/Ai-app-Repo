<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ title }} · map</title>

  {# A map and nothing else: no header, menu or sign-in. Shown inside an
     iframe on other sites -- see embed_maps.py. #}
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js"></script>
  <style>
    html, body { height: 100%; margin: 0; }
    body { font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #1c1f1d; background: #e9eceb; }
    #map { position: absolute; inset: 0; }
    .chip {
      position: absolute; top: 10px; left: 10px; z-index: 2; max-width: calc(100% - 120px);
      padding: 7px 12px; border-radius: 999px; background: rgba(255,255,255,0.94); color: #1c1f1d;
      font-weight: 600; font-size: 13px; text-decoration: none; box-shadow: 0 1px 6px rgba(0,0,0,0.22);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .chip span { font-weight: 400; color: #5b625e; }
    .note {
      position: absolute; inset: 0; z-index: 3; display: flex; align-items: center; justify-content: center;
      padding: 24px; text-align: center; color: #4a514d; background: #e9eceb;
    }
    .note[hidden] { display: none; }
    .pop { max-width: 230px; font-size: 13px; }
    .pop strong { font-size: 14px; }
    .pop__cat { margin-top: 3px; color: #5b625e; text-transform: capitalize; }
    .pop__addr { margin-top: 6px; }
    .pop__notes { margin-top: 6px; font-style: italic; }
    .pop__links { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 10px; }
    .pop__links a { color: #1d6fa5; font-weight: 600; text-decoration: none; }
    .mapboxgl-popup-content { padding: 12px 14px 12px; border-radius: 10px; }
    .mapboxgl-popup-close-button { font-size: 18px; padding: 2px 6px; }

    /* Place cards (name, rating, address). Wide embed: a scrollable list down
       the left. Narrow embed (<=640px wide): a swipeable strip along the
       bottom. Only shown once zoomed in to city level, never at wide views. */
    .cards { display: none; position: absolute; z-index: 2; left: 10px; top: 56px; width: 240px; max-height: calc(100% - 72px);
      flex-direction: column; gap: 8px; overflow-y: auto; overscroll-behavior: contain; padding: 2px 4px 2px 2px;
      scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.35) transparent; }
    .cards.is-visible { display: flex; }
    .card { position: relative; overflow: hidden; flex: 0 0 auto; box-sizing: border-box; width: 100%; display: flex; flex-direction: column; gap: 3px; padding: 9px 12px;
      text-align: left; font: inherit; color: #fff; background: rgba(20,20,22,0.86);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border: 0.5px solid rgba(255,255,255,0.12); border-radius: 14px; cursor: pointer; transition: border-color 0.15s; }
    .card:hover { border-color: rgba(255,255,255,0.3); }
    .card:focus-visible { outline: 2px solid #7ee2bf; outline-offset: 2px; }
    .card.is-active { border-color: rgba(126,226,191,0.7); }
    /* With a picture: it fills the card, a dark fade keeps the text readable. */
    .card.has-photo { min-height: 92px; justify-content: flex-end; background: #1b1d21; }
    .card__bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
    .card.has-photo::before { content: ""; position: absolute; inset: 0; z-index: 1;
      background: linear-gradient(180deg, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.38) 42%, rgba(0,0,0,0.84) 100%); }
    .card.has-photo .card__top, .card.has-photo .card__addr { position: relative; z-index: 2; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }
    .card__top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .card__title { display: flex; align-items: center; gap: 7px; min-width: 0; }
    .card__dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .card__name { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card__rating { flex-shrink: 0; font-size: 12px; font-weight: 800; color: #f5b301; }
    .card__addr { font-size: 11.5px; line-height: 1.35; color: rgba(255,255,255,0.65);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    @media (max-width: 640px) {
      .cards { top: auto; bottom: 28px; left: 0; right: 0; width: auto; max-height: none; flex-direction: row; gap: 10px;
        padding: 0 10px; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scroll-padding: 0 10px; scrollbar-width: none; }
      .cards::-webkit-scrollbar { display: none; }
      .card { width: 220px; scroll-snap-align: start; }
      .card.has-photo { min-height: 84px; }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="cards" class="cards" aria-label="Places in view"></div>
  <a id="chip" class="chip" href="#" target="_blank" rel="noopener noreferrer" hidden></a>
  <div id="note" class="note" hidden></div>

  <script id="map-data" type="application/json">{{ payload|tojson }}</script>
  <script>
    (function () {
      var data = JSON.parse(document.getElementById('map-data').textContent || '{}');
      var places = data.places || [];
      var note = document.getElementById('note');

      function say(message) { note.textContent = message; note.hidden = false; }

      // The title chip links to the full page for this map.
      var chip = document.getElementById('chip');
      chip.href = data.open || '#';
      chip.textContent = data.title || 'Map';
      var count = document.createElement('span');
      count.textContent = ' · ' + places.length + (places.length === 1 ? ' place' : ' places');
      chip.appendChild(count);
      chip.hidden = false;

      if (typeof mapboxgl === 'undefined') { say('The map could not load. Please check your connection and try again.'); return; }
      if (!data.token) { say('This map is not available right now.'); return; }
      if (!places.length) { say('No pinned places on this map yet.'); return; }

      mapboxgl.accessToken = data.token;

      function categoryColor(category) {
        var c = (category || '').toLowerCase();
        if (c.indexOf('coffee') >= 0) return '#C6935A';
        if (c.indexOf('bar') >= 0 || c.indexOf('cocktail') >= 0) return '#B368F7';
        if (c.indexOf('wine') >= 0) return '#B4436C';
        if (c.indexOf('rooftop') >= 0) return '#5AC8E8';
        if (c.indexOf('shop') >= 0) return '#F5B301';
        if (c.indexOf('restaurant') >= 0 || c.indexOf('food') >= 0) return '#E2574C';
        return '#2f9e7e';
      }

      function markerEl(place) {
        var el = document.createElement('div');
        el.style.cursor = 'pointer';
        el.style.filter = 'drop-shadow(0 2px 4px rgba(0,0,0,0.4))';
        el.setAttribute('role', 'button');
        el.setAttribute('aria-label', place.name);
        el.innerHTML = '<svg width="28" height="36" viewBox="0 0 28 36" xmlns="http://www.w3.org/2000/svg"><path d="M14 1C6.8 1 1 6.7 1 13.7c0 9.6 13 21.3 13 21.3s13-11.7 13-21.3C27 6.7 21.2 1 14 1z" fill="' +
          categoryColor(place.category) + '" stroke="#0b0c0d" stroke-width="1.5"/><circle cx="14" cy="13.5" r="5" fill="#0b0c0d" fill-opacity="0.85"/></svg>';
        return el;
      }

      // Popups are built with textContent, never innerHTML, so a place name
      // or note can't inject markup into the page.
      function addText(parent, tag, className, text) {
        var el = document.createElement(tag);
        if (className) el.className = className;
        el.textContent = text;
        parent.appendChild(el);
        return el;
      }

      function addLink(parent, label, href) {
        var a = document.createElement('a');
        a.textContent = label;
        a.href = href;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        parent.appendChild(a);
      }

      function popupNode(place) {
        var box = document.createElement('div');
        box.className = 'pop';
        addText(box, 'strong', '', place.name);
        if (place.category) addText(box, 'div', 'pop__cat', place.category.replace(/_/g, ' '));
        if (place.address) addText(box, 'div', 'pop__addr', place.address);
        if (place.notes) addText(box, 'div', 'pop__notes', place.notes);
        var links = document.createElement('div');
        links.className = 'pop__links';
        addLink(links, 'Directions', 'https://www.google.com/maps/dir/?api=1&destination=' + place.lat + ',' + place.lng);
        if (place.website) addLink(links, 'Website', place.website);
        if (place.listing) addLink(links, 'Show listing', '/listing/' + encodeURIComponent(place.listing));
        box.appendChild(links);
        return box;
      }

      var map = new mapboxgl.Map({
        container: 'map',
        style: data.style,
        center: [places[0].lng, places[0].lat],
        zoom: 11,
        cooperativeGestures: true   // inside an article: two fingers / ctrl+scroll move the map, one finger scrolls the page
      });
      map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), 'top-right');
      map.addControl(new mapboxgl.FullscreenControl(), 'top-right');

      // ---- Place cards ----------------------------------------------------
      // Shown only once the map is zoomed in at least this far (about "a city
      // fills the view"). Raise the number to show them later, lower for sooner.
      var CARDS_MIN_ZOOM = 10;
      var mapEl = document.getElementById('map');
      var cardsEl = document.getElementById('cards');
      var cardsKey = '';
      var activePlace = null;
      var markers = [];

      function hideCards() {
        cardsEl.classList.remove('is-visible');
        cardsEl.innerHTML = '';
        cardsEl._places = [];
        cardsKey = '';
      }

      function scrollToActiveCard() {
        if (!activePlace) return;
        var i = (cardsEl._places || []).indexOf(activePlace);
        var card = i >= 0 ? cardsEl.querySelectorAll('.card')[i] : null;
        if (!card) return;
        // Scroll only the card list itself (scrollIntoView could scroll the article too).
        if (getComputedStyle(cardsEl).flexDirection === 'row') cardsEl.scrollTo({ left: Math.max(0, card.offsetLeft - 10), behavior: 'smooth' });
        else cardsEl.scrollTo({ top: Math.max(0, card.offsetTop - 8), behavior: 'smooth' });
      }

      function setActive(place) {
        activePlace = place;
        var list = cardsEl._places || [];
        cardsEl.querySelectorAll('.card').forEach(function (c, i) {
          c.classList.toggle('is-active', !!place && list[i] === place);
        });
        scrollToActiveCard();
      }

      // Cards are built with textContent, like the popups, so a place name or
      // address can't inject markup.
      function cardNode(place, index) {
        var card = document.createElement('button');
        card.type = 'button';
        card.className = 'card' + (place === activePlace ? ' is-active' : '');
        card.setAttribute('data-idx', String(index));
        // Background picture (served through /embed/photo, never a raw Google link).
        if (place.photo) {
          var img = document.createElement('img');
          img.className = 'card__bg';
          img.alt = '';
          img.loading = 'lazy';
          img.decoding = 'async';
          img.addEventListener('error', function () { img.remove(); card.classList.remove('has-photo'); }, { once: true });
          img.src = place.photo;
          card.appendChild(img);
          card.classList.add('has-photo');
        }
        var top = document.createElement('div');
        top.className = 'card__top';
        var title = document.createElement('div');
        title.className = 'card__title';
        var dot = document.createElement('span');
        dot.className = 'card__dot';
        dot.style.background = categoryColor(place.category);
        title.appendChild(dot);
        addText(title, 'span', 'card__name', place.name);
        top.appendChild(title);
        if (place.rating !== null && place.rating !== undefined && place.rating !== '' && !isNaN(Number(place.rating))) {
          addText(top, 'span', 'card__rating', '★ ' + Number(place.rating).toFixed(1));
        }
        card.appendChild(top);
        if (place.address) addText(card, 'div', 'card__addr', place.address);
        return card;
      }

      // Re-syncs the cards to the places currently on screen. Shows nothing
      // until the map is zoomed in to city level.
      function updateCards() {
        if (map.getZoom() < CARDS_MIN_ZOOM) { hideCards(); return; }
        var w = mapEl.clientWidth, h = mapEl.clientHeight;
        var inView = places.filter(function (p) {
          var pt = map.project([p.lng, p.lat]);
          return pt.x >= 0 && pt.x <= w && pt.y >= 0 && pt.y <= h;
        });
        if (!inView.length) { hideCards(); return; }
        var key = inView.map(function (p) { return places.indexOf(p); }).join(',');
        if (key === cardsKey && cardsEl.classList.contains('is-visible')) { scrollToActiveCard(); return; }
        cardsKey = key;
        cardsEl._places = inView;
        cardsEl.innerHTML = '';
        inView.forEach(function (p, i) { cardsEl.appendChild(cardNode(p, i)); });
        cardsEl.scrollTop = 0;
        cardsEl.scrollLeft = 0;
        cardsEl.classList.add('is-visible');
        scrollToActiveCard();
      }

      cardsEl.addEventListener('click', function (e) {
        var card = e.target.closest('.card');
        if (!card) return;
        var place = (cardsEl._places || [])[Number(card.getAttribute('data-idx'))];
        if (!place) return;
        setActive(place);
        map.flyTo({ center: [place.lng, place.lat], zoom: Math.max(map.getZoom(), 14), duration: 1000, essential: true });
        var marker = markers.filter(function (m) { return m._place === place; })[0];
        if (marker) setTimeout(function () { if (!marker.getPopup().isOpen()) marker.togglePopup(); }, 600);
      });

      var bounds = new mapboxgl.LngLatBounds();
      places.forEach(function (place) {
        var popup = new mapboxgl.Popup({ offset: 26, maxWidth: '260px' }).setDOMContent(popupNode(place));
        popup.on('open', function () { setActive(place); });
        popup.on('close', function () { if (activePlace === place) setActive(null); });
        var marker = new mapboxgl.Marker({ element: markerEl(place) })
          .setLngLat([place.lng, place.lat])
          .setPopup(popup)
          .addTo(map);
        marker._place = place;
        markers.push(marker);
        bounds.extend([place.lng, place.lat]);
      });

      // Hide the moment you zoom back out, show as soon as you zoom in past
      // the threshold, and re-sync the list whenever a pan/zoom finishes.
      map.on('zoom', function () {
        var showing = cardsEl.classList.contains('is-visible');
        var close = map.getZoom() >= CARDS_MIN_ZOOM;
        if (showing && !close) hideCards();
        else if (!showing && close) updateCards();
      });
      map.on('moveend', updateCards);

      map.on('load', function () {
        if (places.length > 1) map.fitBounds(bounds, { padding: 56, maxZoom: 14, duration: 0 });
        else map.jumpTo({ center: [places[0].lng, places[0].lat], zoom: 13 });
        updateCards();
      });
    })();
  </script>
</body>
</html>
