        addText(title, 'span', 'lsheet__count', String(shown.length));
        lsheetList.innerHTML = '';
        shown.forEach(function (p) { lsheetList.appendChild(listCard(p)); });
        lsheetList.scrollTop = 0;
        if (openPopup) openPopup.remove();
        document.body.classList.add('list-open');
        lsheet.setAttribute('aria-hidden', 'false');
        void lsheet.offsetHeight;
        lsheet.classList.add('is-open');
      }

      lsheet.addEventListener('click', function (e) { if (e.target.closest('[data-lsheet-close]')) closeList(); });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && lsheet.classList.contains('is-open') && detailEl.hidden && viewerEl.hidden) closeList();
      });

      if (standalone || STORY_MODE) document.body.classList.add('touch-full');   // the map fills the screen: pinch to zoom
      if (standalone) {
        var tools = document.createElement('div');
        tools.className = 'maptools';
        var listBtn = document.createElement('button');
        listBtn.type = 'button';
        listBtn.className = 'maptool maptool--list';
        listBtn.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg><span>List</span>';
        listBtn.addEventListener('click', openList);
        tools.appendChild(listBtn);
        // "Where am I": Mapbox's own locate control does the work (blue dot,
        // permission prompt); its button is hidden and ours triggers it.
        var geo = new mapboxgl.GeolocateControl({ positionOptions: { enableHighAccuracy: true }, trackUserLocation: false, showUserHeading: false });
        map.addControl(geo, 'top-left');
        var locBtn = document.createElement('button');
        locBtn.type = 'button';
        locBtn.className = 'maptool maptool--locate';
        locBtn.setAttribute('aria-label', 'Show where I am');
        locBtn.title = 'Where am I';
        locBtn.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="1.8"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/></svg>';
        locBtn.addEventListener('click', function () { try { geo.trigger(); } catch (e) {} });
        tools.appendChild(locBtn);
        document.body.appendChild(tools);
      }

      // ---- Show one place (asked by the story around the map) -------------
      // A link to a directory listing inside a travel map story asks the map
      // to fly to that place and open its card. Found by its listing, or by name.
      window.addEventListener('message', function (e) {
        if (e.source !== window.parent || window.parent === window || !e.data || e.data.type !== 'mansfield:focus-place') return;
        var slug = String(e.data.listing || ''), name = String(e.data.name || '').trim().toLowerCase();
        var place = places.filter(function (p) { return slug && p.listing === slug; })[0] ||
                    places.filter(function (p) { return name && (p.name || '').toLowerCase() === name; })[0];
        window.parent.postMessage({ type: 'mansfield:focused', found: !!place }, e.origin || '*');
        if (!place) return;
        if (!passes(place)) { picked = {}; topRated = false; applyFilters(false); }
        if (!viewerEl.hidden) closeViewer();
        if (!detailEl.hidden) closeDetail();
        if (lsheet.classList.contains('is-open')) closeList();
        if (openPopup && openPopup._place !== place) openPopup.remove();
        setActive(place);
        map.flyTo({ center: [place.lng, place.lat], zoom: Math.max(map.getZoom(), 15), duration: 1200, essential: true });
        var marker = markers.filter(function (m) { return m._place === place; })[0];
        if (marker) map.once('moveend', function () { if (!marker.getPopup().isOpen()) marker.togglePopup(); });
      });

      // ---- Route: numbered stops (a travel map story) -----------------------
      // The story page lists the places its text links to, in reading order.
      // Those become stops 1, 2, 3...: numbered pins joined by a dotted line,
      // and cards for just those stops. The page then tells us which stop the
      // reader is on (route-step) and whether we are the thin strip above the
      // story or the whole map (route-view).
      var route = null;            // { stops: [place], legs: [metres] }
      var routeStep = -1;
      var routeView = 'strip';
      var routePad = { top: 0, bottom: 0 };
      var routeOrigin = '*';
      var mapReady = false;
      map.on('load', function () { mapReady = true; if (route) drawRoute(); });

      function metres(a, b) {
        var R = 6371000, toR = Math.PI / 180;
        var dLat = (b.lat - a.lat) * toR, dLng = (b.lng - a.lng) * toR;
        var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(a.lat * toR) * Math.cos(b.lat * toR) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
        return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
      }
      // With the real walking path (Mapbox) we have real times; before it
      // arrives, straight-line distance plus a bit for real streets.
      function legText(m, secs) {
        if (secs > 0 && secs <= 3 * 3600) return Math.max(1, Math.round(secs / 60)) + ' min walk';
        if (!(secs > 0) && m <= 2500) return Math.max(1, Math.round(m * 1.3 / 80)) + ' min walk';
        var km = m / 1000;
        return (km >= 10 ? Math.round(km) : km.toFixed(1)) + ' km';
      }
      function legLabel(i) { return legText(route.legs[i], route.durations ? route.durations[i] : 0); }
      function kmText(m) { var km = m / 1000; return (km >= 10 ? Math.round(km) : km.toFixed(1)) + ' km'; }

      function drawRoute() {
        if (!route || !mapReady) return;
        // The real path along the streets once Mapbox has answered (or a re-routed walk), else straight lines.
        var coords = (walk && walk.drawn) || route.path || route.stops.map(function (p) { return [p.lng, p.lat]; });
        var line = { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: coords } };
        var src = map.getSource('mansfield-route');
        if (src) { src.setData(line); return; }
        map.addSource('mansfield-route', { type: 'geojson', data: line });
        // A soft dark band with white dots on it: reads on light and dark map styles alike.
        // Layer 1: a soft dark band under the line (the "casing")
        map.addLayer({ id: 'mansfield-route-band', type: 'line', source: 'mansfield-route',
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: { 'line-color': '#0b2414', 'line-opacity': 0.6, 'line-width': 9 } });   // dark outline so the green stands out on light streets too

        // Layer 2: the bright green route line on top
        map.addLayer({ id: 'mansfield-route-dots', type: 'line', source: 'mansfield-route',
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: { 'line-color': '#2BEA6B', 'line-opacity': 1, 'line-width': 5 } });   // bright green walking route
      }

      function frameOn(list, pad, maxZoom, duration) {
        if (!list.length) return;
        var h = mapEl.clientHeight, w = mapEl.clientWidth;
        var top = Math.max(0, pad.top || 0) + 28, bottom = Math.max(0, pad.bottom || 0) + 28;
        if (top + bottom > h - 40) { var k = (h - 40) / (top + bottom); top *= k; bottom *= k; }
        var side = Math.min(44, w / 5);
        var b = new mapboxgl.LngLatBounds();
        list.forEach(function (p) { b.extend([p.lng, p.lat]); });
        map.fitBounds(b, { padding: { top: top, bottom: bottom, left: side, right: side }, maxZoom: maxZoom, duration: duration, essential: true });
      }

      function paintRoute() {
        if (!route) return;
        markers.forEach(function (m) {
          var k = route.stops.indexOf(m._place);
          m.getElement().classList.toggle('mk--past', k >= 0 && routeStep >= 0 && k < routeStep && routeView === 'strip');
        });
      }

      // The strip follows the reader: the stop they are reading about, with
      // the one before and after it for context; before the first stop, the
      // whole route.
      function showStep(duration) {
        if (!route) return;
        var s = route.stops, i = routeStep;
        if (routeView === 'strip') {
          if (i < 0) frameOn(s, routePad, 15, duration);
          else frameOn([s[i - 1], s[i], s[i + 1]].filter(Boolean), routePad, 16, duration);
        }
      }

      function showRouteCards() {
        if (cardsKey === 'route' && cardsEl.classList.contains('is-visible')) { scrollToActiveCard(); return; }
        cardsKey = 'route';
        var stops = route.stops;
        cardsEl._places = stops.slice();
        cardsEl.innerHTML = '';
        stops.forEach(function (p, i) {
          var card = cardNode(p, i);
          var info = card.querySelector('.card__info');
          var step = document.createElement('div');
          step.className = 'card__step';
          step.textContent = 'Stop ' + (i + 1) + ' of ' + stops.length + (i ? ' · ' + legLabel(i - 1) : '');
          info.insertBefore(step, info.firstChild);
          var note = info.querySelector('.card__note');
          if (note) note.remove();   // room for the button; the note is in the story
          var read = addText(info, 'span', 'card__read', 'Read about this');
          read.setAttribute('data-read', '1');
          cardsEl.appendChild(card);
        });
        cardsEl.scrollLeft = 0;
        cardsEl.classList.add('is-visible');
        document.body.classList.add('has-cards');
        scrollToActiveCard();
      }

      function readAbout(place) {
        var i = route ? route.stops.indexOf(place) : -1;
        if (i < 0) return;
        window.parent.postMessage({ type: 'mansfield:read-about', listing: place.listing || '', name: place.name || '', index: i }, routeOrigin);
      }

      function applyRoute(wanted) {
        var stops = [];
        (Array.isArray(wanted) ? wanted : []).slice(0, 60).forEach(function (w) {
          var slug = String((w && w.listing) || ''), name = String((w && w.name) || '').trim().toLowerCase();
          var place = places.filter(function (p) { return slug && p.listing === slug; })[0] ||
                      places.filter(function (p) { return name && (p.name || '').toLowerCase() === name; })[0];
          if (place && stops.indexOf(place) < 0) stops.push(place);
        });
        if (stops.length < 2) return [];
        var legs = [];
        for (var i = 1; i < stops.length; i++) legs.push(metres(stops[i - 1], stops[i]));
        route = { stops: stops, legs: legs };
        document.body.classList.add('has-route');
        if (openPopup) openPopup.remove();
        markers.forEach(function (m) {
          var el = m.getElement(), k = stops.indexOf(m._place);
          el.classList.toggle('mk--stop', k >= 0);
          el.classList.toggle('mk--off', k < 0);
          if (k >= 0) {
            var dot = el.querySelector('.mk__dot');
            dot.innerHTML = '';
            addText(dot, 'b', 'mk__num', String(k + 1));
            el.setAttribute('aria-label', 'Stop ' + (k + 1) + ': ' + m._place.name);
            var node = m.getPopup()._node, links = node && node.querySelector('.pop__links');
            if (links && !links.querySelector('.is-read')) {
              var read = document.createElement('button');
              read.type = 'button';
              read.className = 'is-read';
              read.textContent = 'Read about this';
              read.addEventListener('click', (function (place) { return function () { readAbout(place); }; })(m._place));
              links.insertBefore(read, links.firstChild);
            }
          }
        });
        var total = legs.reduce(function (a, b) { return a + b; }, 0);
        var pill = document.createElement('div');
        pill.className = 'routepill';
        pill.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="13" cy="4" r="2"/><path d="M10 22l2-7 3 3v6M8 12l3-4 4 1 2 4M11 8l-2 6"/></svg>';
        route.pillTitle = addText(pill, 'span', 'routepill__title', total <= 10000 ? 'Walking route' : 'Route');
        route.pillSub = addText(pill, 'small', '', stops.length + ' stops · ' + kmText(total));
        var startBtn = document.createElement('button');
        startBtn.type = 'button';
        startBtn.className = 'routepill__start';
        startBtn.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg>';   // fixed icon
        addText(startBtn, 'span', '', 'Start');
        startBtn.setAttribute('aria-label', 'Start walk: follow the route with your location');
        startBtn.hidden = !('geolocation' in navigator);
        startBtn.addEventListener('click', startWalk);
        pill.appendChild(startBtn);
        document.body.appendChild(pill);
        cardsKey = '';
        drawRoute();
        paintRoute();
        showStep(0);
        updateCards();
        fetchWalk();
        return stops;
      }

      // ---- The real walking path (Mapbox walking directions, via /embed/walk) --
      function walkQuery(points) {
        return points.map(function (p) { return (+p[0]).toFixed(5) + ',' + (+p[1]).toFixed(5); }).join(';');
      }
      function fetchWalk() {
        if (!route || route.stops.length > 25) return;
        fetch('/embed/walk?c=' + encodeURIComponent(walkQuery(route.stops.map(function (p) { return [p.lng, p.lat]; }))), { credentials: 'omit' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (d) {
            if (!d || !d.geometry || !Array.isArray(d.legs) || d.legs.length !== route.stops.length - 1) return;
            route.path = d.geometry.coordinates;
            route.walk = d;
            route.legs = d.legs.map(function (l) { return Number(l.distance) || 0; });
            route.durations = d.legs.map(function (l) { return Number(l.duration) || 0; });
            var total = Number(d.distance) || route.legs.reduce(function (a, b) { return a + b; }, 0);
            if (route.pillSub) route.pillSub.textContent = route.stops.length + ' stops · ' + kmText(total) + ' · ' + Math.max(1, Math.round((Number(d.duration) || 0) / 60)) + ' min';
            drawRoute();
            if (routeView === 'full') { cardsKey = ''; updateCards(); }
            // The story page shows the same times (its route card, the List).
            window.parent.postMessage({ type: 'mansfield:route-walk', legs: route.legs, durations: route.durations,
                                        total: total, duration: Number(d.duration) || 0 }, routeOrigin);
          })
          .catch(function () {});   // no path: the straight dotted lines stay
      }

      // ---- Walk mode: follow the walker along the route ----------------------
      // Uses the phone's location only while the walk is on; it is never sent
      // anywhere except /embed/walk when the walker strays and needs a new path.
      var walk = null;
      var walkEls = null;
      var ARRIVE_M = 30, OFF_M = 40, SPEED = 1.3;   // metres, metres, metres per second

      function walkUi() {
        if (walkEls) return walkEls;
        var bar = document.createElement('div');
        bar.className = 'walkbar';
        bar.setAttribute('role', 'status');
        bar.setAttribute('aria-live', 'polite');
        bar.innerHTML = '<div class="walkbar__row"><span class="walkbar__num" hidden></span><div class="walkbar__text"><div class="walkbar__next"></div>' +
          '<div class="walkbar__eta"></div></div><button type="button" class="walkbar__end">End</button></div>' +
          '<div class="walkbar__turn" hidden><svg viewBox="0 0 24 24" aria-hidden="true"></svg><span></span></div>';
        var arrive = document.createElement('div');
        arrive.className = 'walkarrive';
        arrive.hidden = true;
        arrive.innerHTML = '<div class="walkarrive__kicker"></div><div class="walkarrive__name"></div>' +
          '<div class="walkarrive__row"><button type="button" data-w="read">Read about this</button><button type="button" class="is-primary" data-w="go">Next stop</button></div>';
        var recenter = document.createElement('button');
        recenter.type = 'button';
        recenter.className = 'walkrecenter';
        recenter.hidden = true;
        recenter.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l18-8-8 18-2-8z"/></svg><span>Recenter</span>';
        document.body.appendChild(bar);
        document.body.appendChild(arrive);
        document.body.appendChild(recenter);
        bar.querySelector('.walkbar__end').addEventListener('click', endWalk);
        recenter.addEventListener('click', function () {
          if (!walk) return;
          walk.follow = true;
          recenter.hidden = true;
          if (walk.me) map.easeTo({ center: walk.me, zoom: Math.max(map.getZoom(), 16.5), duration: 600 });
        });
        arrive.addEventListener('click', function (e) {
          var b = e.target.closest('[data-w]');
          if (!b || !walk) return;
          var place = route.stops[walk.arrivedAt];
          arrive.hidden = true;
          if (b.getAttribute('data-w') === 'read' && place) readAbout(place);
        });
        // Moving the map by hand stops following until Recenter.
        map.on('dragstart', function () { if (walk && walk.follow) { walk.follow = false; recenter.hidden = false; } });
        walkEls = { bar: bar, num: bar.querySelector('.walkbar__num'), next: bar.querySelector('.walkbar__next'),
                    eta: bar.querySelector('.walkbar__eta'), turn: bar.querySelector('.walkbar__turn'),
                    turnIcon: bar.querySelector('.walkbar__turn svg'), turnText: bar.querySelector('.walkbar__turn span'),
                    arrive: arrive, kicker: arrive.querySelector('.walkarrive__kicker'), aname: arrive.querySelector('.walkarrive__name'),
                    go: arrive.querySelector('[data-w="go"]'), recenter: recenter };
        return walkEls;
      }

      // Geometry along a path, in metres (a flat approximation, fine at walking scale).
      function cumulative(coords) {
        var cum = [0];
        for (var i = 1; i < coords.length; i++) cum.push(cum[i - 1] + metres({ lng: coords[i - 1][0], lat: coords[i - 1][1] }, { lng: coords[i][0], lat: coords[i][1] }));
        return cum;
      }
      function snapTo(coords, cum, p, minAlong) {
        var kx = Math.cos(p[1] * Math.PI / 180) * 111320, ky = 110540;
        var best = { along: 0, off: Infinity };
        for (var i = 0; i < coords.length - 1; i++) {
          if (minAlong && cum[i + 1] < minAlong) continue;
          var ax = (coords[i][0] - p[0]) * kx, ay = (coords[i][1] - p[1]) * ky;
          var bx = (coords[i + 1][0] - p[0]) * kx, by = (coords[i + 1][1] - p[1]) * ky;
          var dx = bx - ax, dy = by - ay, len2 = dx * dx + dy * dy;
          var t = len2 ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / len2)) : 0;
          var x = ax + t * dx, y = ay + t * dy, d = Math.sqrt(x * x + y * y);
          if (d < best.off) best = { along: cum[i] + t * (cum[i + 1] - cum[i]), off: d };
        }
        return best;
      }

      // Lay the walk out on a path: where each remaining stop and each turn sits along it.
      function setWalkPath(coords, legs, firstStop) {
        walk.coords = coords;
        walk.cum = cumulative(coords);
        walk.first = firstStop;
        walk.targets = [];
        walk.steps = [];
        var along = 0;
        for (var k = firstStop; k < route.stops.length; k++) {
          var s = route.stops[k];
          var hit = snapTo(coords, walk.cum, [s.lng, s.lat], along);
          along = hit.along;
          walk.targets[k] = along;
        }
        var from = 0;
        (legs || []).forEach(function (leg) {
          (leg.steps || []).forEach(function (st) {
            if (!st.at || !st.text) return;
            var hit = snapTo(coords, walk.cum, st.at, from);
            from = hit.along;
            walk.steps.push({ along: hit.along, text: st.text, type: st.type, modifier: st.modifier });
          });
        });
        walk.drawn = coords;
        drawRoute();
      }

      var TURN_ICONS = {
        left: '<path d="M14 20v-7a3 3 0 0 0-3-3H5"/><path d="M9 6l-4 4 4 4"/>',
        right: '<path d="M10 20v-7a3 3 0 0 1 3-3h6"/><path d="M15 6l4 4-4 4"/>',
        straight: '<path d="M12 20V5"/><path d="M7 10l5-5 5 5"/>',
        uturn: '<path d="M8 20V9a4 4 0 0 1 8 0v4"/><path d="M12 10l4 4 4-4"/>',
        arrive: '<path d="M6 21V4"/><path d="M6 4h11l-2 4 2 4H6"/>'
      };
      function turnIcon(st) {
        if (!st) return TURN_ICONS.straight;
        if (st.type === 'arrive') return TURN_ICONS.arrive;
        var m = st.modifier || '';
        if (m.indexOf('uturn') >= 0) return TURN_ICONS.uturn;
        if (m.indexOf('left') >= 0) return TURN_ICONS.left;
        if (m.indexOf('right') >= 0) return TURN_ICONS.right;
        return TURN_ICONS.straight;
      }
      function distText(m) { return m >= 1000 ? (m / 1000).toFixed(1) + ' km' : (Math.max(10, Math.round(m / 10) * 10)) + ' m'; }

      function paintWalkPins() {
        markers.forEach(function (m) {
          var k = route.stops.indexOf(m._place);
          m.getElement().classList.toggle('mk--done', !!walk && k >= 0 && k < walk.next);
        });
        setActive(walk && walk.next < route.stops.length ? route.stops[walk.next] : null);
      }

      function showWalkStatus(text, sub) {
        var ui = walkUi();
        ui.num.hidden = true;
        ui.next.textContent = text;
        ui.eta.textContent = sub || '';
        ui.turn.hidden = true;
      }

      function updateWalkBar(along, off, me) {
        var ui = walkUi();
        if (walk.next >= route.stops.length) {
          ui.num.hidden = true;
          ui.next.textContent = 'Walk complete';
          ui.eta.textContent = 'All ' + route.stops.length + ' stops. Nice walk!';
          ui.turn.hidden = true;
          return;
        }
        var s = route.stops[walk.next];
        var straight = metres({ lng: me[0], lat: me[1] }, s);
        var left = off > OFF_M ? straight : Math.max(0, walk.targets[walk.next] - along);
        ui.num.hidden = false;
        ui.num.textContent = String(walk.next + 1);
        ui.num.style.setProperty('--c', categoryColor(s.category));
        ui.next.textContent = 'Next: ' + s.name;
        ui.eta.textContent = Math.max(1, Math.round(left / SPEED / 60)) + ' min · ' + distText(left);
        var st = null;
        if (off <= OFF_M) {
          for (var i = 0; i < walk.steps.length; i++) {
            if (walk.steps[i].along > along + 8 && walk.steps[i].along <= walk.targets[walk.next] + 15) { st = walk.steps[i]; break; }
          }
        }
        ui.turn.hidden = false;
        ui.turnIcon.innerHTML = turnIcon(st);   // fixed icons only
        if (off > OFF_M) ui.turnText.textContent = 'Off the route. Finding a new way to ' + s.name + '\u2026';
        else if (!st) ui.turnText.textContent = 'Continue to ' + s.name;
        else if (st.type === 'arrive') ui.turnText.textContent = 'In ' + distText(st.along - along) + ', arrive at ' + s.name;
        else ui.turnText.textContent = 'In ' + distText(st.along - along) + ', ' + st.text.charAt(0).toLowerCase() + st.text.slice(1);
      }

      function arrivedAt(k) {
        var ui = walkUi();
        var s = route.stops[k];
        walk.arrivedAt = k;
        walk.next = k + 1;
        ui.kicker.textContent = 'You\u2019re at stop ' + (k + 1) + ' of ' + route.stops.length;
        ui.kicker.style.setProperty('--c', categoryColor(s.category));
        ui.aname.textContent = s.name;
        ui.go.textContent = walk.next < route.stops.length ? 'Next stop' : 'Done';
        ui.arrive.hidden = false;
        clearTimeout(walk.arriveTimer);
        walk.arriveTimer = setTimeout(function () { ui.arrive.hidden = true; }, 25000);   // out of the way once they move on
        paintWalkPins();
      }

      function reroute(me) {
        var now = Date.now();
        if (walk.rerouting || now - walk.lastReroute < 20000 || walk.next >= route.stops.length) return;
        walk.rerouting = true;
        walk.lastReroute = now;
        var pts = [me].concat(route.stops.slice(walk.next).map(function (p) { return [p.lng, p.lat]; })).slice(0, 25);
        fetch('/embed/walk?from=me&c=' + encodeURIComponent(walkQuery(pts)), { credentials: 'omit', cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (d) {
            walk && (walk.rerouting = false);
            if (!walk || !d || !d.geometry) return;
            setWalkPath(d.geometry.coordinates, d.legs, walk.next);
            walk.offCount = 0;
          })
          .catch(function () { if (walk) walk.rerouting = false; });
      }

      function onFix(pos) {
        if (!walk) return;
        var c = pos.coords, me = [c.longitude, c.latitude];
        walk.me = me;
        if (!walk.marker) {
          var el = document.createElement('div');
          el.className = 'me';
          el.innerHTML = '<span class="me__halo"></span><span class="me__dot"></span>';
          walk.marker = new mapboxgl.Marker({ element: el }).setLngLat(me).addTo(map);
          map.flyTo({ center: me, zoom: Math.max(map.getZoom(), 16.5), duration: 900, essential: true });
        } else {
          walk.marker.setLngLat(me);
          if (walk.follow && !map.isMoving()) map.easeTo({ center: me, duration: 600 });
        }
        // First fix: if the walker is already at one of the stops, start from there.
        if (!walk.started) {
          walk.started = true;
          for (var k = route.stops.length - 1; k >= 0; k--) {
            if (metres({ lng: me[0], lat: me[1] }, route.stops[k]) <= ARRIVE_M) { arrivedAt(k); break; }
          }
        }
        if (walk.next >= route.stops.length) { updateWalkBar(0, 0, me); return; }
        var hit = snapTo(walk.coords, walk.cum, me, 0);
        var s = route.stops[walk.next];
        if (metres({ lng: me[0], lat: me[1] }, s) <= ARRIVE_M ||
            (hit.off <= ARRIVE_M && hit.along >= walk.targets[walk.next] - 10)) {
          arrivedAt(walk.next);
        }
        var good = !(c.accuracy > 50);
        walk.offCount = hit.off > OFF_M && good ? (walk.offCount || 0) + 1 : 0;
        if (walk.offCount >= 3) reroute(me);
        updateWalkBar(hit.along, hit.off, me);
      }

      function onFixError(err) {
        if (!walk) return;
        if (err && err.code === 1) {
          showWalkStatus('Location is off for this page', 'Allow location in your browser or phone settings to follow the walk.');
          if (walk.watch !== null) navigator.geolocation.clearWatch(walk.watch);
          walk.watch = null;
        } else if (!walk.me) {
          showWalkStatus('Looking for you\u2026', 'Waiting for your phone\u2019s location.');
        }
      }

      function startWalk() {
        if (!route || walk || !('geolocation' in navigator)) return;
        walk = { next: 0, follow: true, offCount: 0, lastReroute: 0, watch: null, me: null, marker: null, started: false };
        var w = route.walk;
        setWalkPath(route.path || route.stops.map(function (p) { return [p.lng, p.lat]; }), w ? w.legs : [], 0);
        if (openPopup) openPopup.remove();
        document.body.classList.add('walking');
        showWalkStatus('Looking for you\u2026', 'Allow location to follow the walk.');
        paintWalkPins();
        walk.watch = navigator.geolocation.watchPosition(onFix, onFixError, { enableHighAccuracy: true, maximumAge: 3000, timeout: 30000 });
        window.parent.postMessage({ type: 'mansfield:walk', on: true }, routeOrigin);
      }

      function endWalk() {
        if (!walk) return;
        if (walk.watch !== null) navigator.geolocation.clearWatch(walk.watch);
        if (walk.marker) walk.marker.remove();
        clearTimeout(walk.arriveTimer);
        walk = null;
        var ui = walkUi();
        ui.arrive.hidden = true;
        ui.recenter.hidden = true;
        document.body.classList.remove('walking');
        markers.forEach(function (m) { m.getElement().classList.remove('mk--done'); });
        drawRoute();
        cardsKey = '';
        updateCards();
        window.parent.postMessage({ type: 'mansfield:walk', on: false }, routeOrigin);
      }

      window.addEventListener('message', function (e) {
        if (e.source !== window.parent || window.parent === window || !e.data || typeof e.data.type !== 'string') return;
        var t = e.data.type;
        if (t === 'mansfield:route') {
          routeOrigin = e.origin || '*';
          var stops = route ? route.stops : applyRoute(e.data.stops);
          var total = route ? route.legs.reduce(function (a, b) { return a + b; }, 0) : 0;
          window.parent.postMessage({ type: 'mansfield:route-ready', total: total, legs: route ? route.legs : [],
            stops: stops.map(function (p) {
              var g = groupOf(p.category);
              return { listing: p.listing || '', name: p.name || '', category: p.category || '', group: g, color: GROUPS[g].color,
                       address: p.address || '', lat: p.lat, lng: p.lng };
            }) }, routeOrigin);
        } else if (t === 'mansfield:route-step' && route) {
          var i = Math.round(Number(e.data.index));
          if (!(i >= -1 && i < route.stops.length) || i === routeStep) return;
          routeStep = i;
          if (walk) return;   // reading along while walking: leave the map on the walker
          if (routeView === 'strip') setActive(i >= 0 ? route.stops[i] : null);
          paintRoute();
          showStep(900);
        } else if (t === 'mansfield:route-view' && route) {
          var view = e.data.view === 'full' ? 'full' : 'strip';
          var pad = e.data.pad || {};
          routePad = { top: Math.max(0, Number(pad.top) || 0), bottom: Math.max(0, Number(pad.bottom) || 0) };
          var was = routeView;
          routeView = view;
          document.body.classList.toggle('route-strip', view === 'strip');
          paintRoute();
          if (view === 'strip') {
            if (openPopup) openPopup.remove();
            if (!viewerEl.hidden) closeViewer();
            if (!detailEl.hidden) closeDetail();
            if (lsheet.classList.contains('is-open')) closeList();
            hideCards();
            if (!walk) {   // during a walk the map stays on the walker
              setActive(routeStep >= 0 ? route.stops[routeStep] : null);
              showStep(was === 'strip' ? 600 : 0);
            }
          } else {
            cardsKey = '';
            updateCards();
            // Show the stop the reader was on, above the card row.
            requestAnimationFrame(function () {
              if (walk) {   // a walk is on: back to the walker
                if (walk.me && walk.follow) map.easeTo({ center: walk.me, zoom: Math.max(map.getZoom(), 16.5), duration: 600 });
                return;
              }
              if (e.data.focus === false) return;
              var s = route.stops, i = routeStep;
              var on = i >= 0 ? [s[i - 1], s[i], s[i + 1]].filter(Boolean) : s;   // the stop, with the one before and after
              frameOn(on, { top: (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--safe-top')) || 0) + 56,
                            bottom: bottomInset() + 10 }, 15.5, 700);
            });
          }
        }
      });


      // ---- Area tools (the media site's "Plan a walk" page) -----------------
      // The page can ask what part of the map the reader is looking at ("food
      // in this area"), and let them draw a circle that the walk planner then
      // searches inside. We only talk to the page we sit in.
      //   page -> map: mansfield:watch-view, mansfield:draw-circle {on},
      //                mansfield:circle-set {center:[lng,lat], radius}, mansfield:circle-clear
      //   map -> page: mansfield:view {center, radius, zoom, byUser},
      //                mansfield:circle {center, radius} (null when cleared), mansfield:draw {on}
      var areaOrigin = null;
      var circle = null;          // {center: [lng, lat], radius: metres}
      var drawing = false, drawStart = null;
      var AREA_MIN = 100, AREA_MAX = 20000, AREA_TAP = 500;

      function tellPage(m) { if (areaOrigin) window.parent.postMessage(m, areaOrigin); }

      function viewNow(byUser) {
        var b = map.getBounds(), c = map.getCenter();
        // The biggest circle that fits on screen: from the middle to the nearer edge.
        var r = Math.min(metres({ lng: c.lng, lat: c.lat }, { lng: c.lng, lat: b.getNorth() }),
                         metres({ lng: c.lng, lat: c.lat }, { lng: b.getEast(), lat: c.lat }));
        return { type: 'mansfield:view', center: [c.lng, c.lat], zoom: map.getZoom(),
                 radius: Math.round(Math.max(AREA_MIN, Math.min(AREA_MAX, r))), byUser: !!byUser };
      }
      map.on('moveend', function (e) { tellPage(viewNow(!!(e && e.originalEvent))); });

      function circleShape(c) {
        var pts = [], mLng = 111320 * Math.cos(c.center[1] * Math.PI / 180);
        for (var i = 0; i <= 64; i++) {
          var a = i / 64 * 2 * Math.PI;
          pts.push([c.center[0] + c.radius * Math.sin(a) / mLng, c.center[1] + c.radius * Math.cos(a) / 111320]);
        }
        return { type: 'Feature', properties: {}, geometry: { type: 'Polygon', coordinates: [pts] } };
      }
      function paintCircle() {
        if (!mapReady) return;
        var data = circle ? circleShape(circle) : { type: 'FeatureCollection', features: [] };
        var src = map.getSource('mansfield-area');
        if (src) { src.setData(data); return; }
        map.addSource('mansfield-area', { type: 'geojson', data: data });
        map.addLayer({ id: 'mansfield-area-fill', type: 'fill', source: 'mansfield-area',
          paint: { 'fill-color': '#2BEA6B', 'fill-opacity': 0.12, 'fill-emissive-strength': 1 } });
        map.addLayer({ id: 'mansfield-area-line', type: 'line', source: 'mansfield-area',
          paint: { 'line-color': '#2BEA6B', 'line-width': 3, 'line-dasharray': [2, 1.5], 'line-emissive-strength': 1 } });
      }
      map.on('load', paintCircle);

      function setDrawing(on) {
        drawing = !!on;
        drawStart = null;
        document.body.classList.toggle('is-drawing', drawing);
        if (drawing) { map.dragPan.disable(); map.dragRotate.disable(); if (openPopup) openPopup.remove(); }
        else { map.dragPan.enable(); map.dragRotate.enable(); }
        map.getCanvas().style.cursor = drawing ? 'crosshair' : '';
        tellPage({ type: 'mansfield:draw', on: drawing });
      }
      function drawFrom(e) {
        if (!drawing) return;
        if (e.originalEvent && e.originalEvent.touches && e.originalEvent.touches.length > 1) return;   // pinch: let it zoom
        e.preventDefault();
        drawStart = e.lngLat;
        circle = { center: [e.lngLat.lng, e.lngLat.lat], radius: AREA_MIN };
        paintCircle();
      }
      function drawTo(e) {
        if (!drawing || !drawStart) return;
        circle.radius = Math.max(AREA_MIN, Math.min(AREA_MAX, metres({ lng: drawStart.lng, lat: drawStart.lat }, { lng: e.lngLat.lng, lat: e.lngLat.lat })));
        paintCircle();
      }
      function drawEnd() {
        if (!drawing || !drawStart) return;
        if (circle.radius < 150) circle.radius = AREA_TAP;   // a tap: a 500 m circle around that spot
        circle.radius = Math.round(circle.radius);
        paintCircle();
        setDrawing(false);
        tellPage({ type: 'mansfield:circle', center: circle.center, radius: circle.radius });
      }
      map.on('mousedown', drawFrom);
      map.on('touchstart', drawFrom);
      map.on('mousemove', drawTo);
      map.on('touchmove', drawTo);
      map.on('mouseup', drawEnd);
      map.on('touchend', drawEnd);

      window.addEventListener('message', function (e) {
        if (e.source !== window.parent || window.parent === window || !e.data || typeof e.data.type !== 'string') return;
        var t = e.data.type;
        if (t === 'mansfield:watch-view') {
          areaOrigin = e.origin || null;
          if (mapReady) tellPage(viewNow(false));                 // the style is up (tiles may still be loading)
          else map.once('load', function () { tellPage(viewNow(false)); });
        } else if (t === 'mansfield:draw-circle') {
          areaOrigin = areaOrigin || e.origin || null;
          setDrawing(!!e.data.on);
        } else if (t === 'mansfield:circle-set') {
          var c = e.data.center, r = Number(e.data.radius);
          if (!Array.isArray(c) || c.length !== 2 || !isFinite(c[0]) || !isFinite(c[1]) || !(r > 0)) return;
          circle = { center: [Number(c[0]), Number(c[1])], radius: Math.max(AREA_MIN, Math.min(AREA_MAX, r)) };
          if (mapReady) paintCircle(); else map.once('load', paintCircle);
        } else if (t === 'mansfield:circle-clear') {
          circle = null;
          if (drawing) setDrawing(false);
          paintCircle();
        }
      });

      map.on('load', function () {
        if (data.explore) map.jumpTo({ center: data.center, zoom: data.zoom || 13.5 });   // explore: stay where the page asked
        else if (places.length > 1) map.fitBounds(bounds, { padding: 56, maxZoom: 14, duration: 0 });
        else map.jumpTo({ center: [places[0].lng, places[0].lat], zoom: 13 });
        updateCards();
      });
    })();
  </script>
</body>
</html>
